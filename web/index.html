<title>Make It Cute</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a white sticker sheet on pastel gingham; three pastel tones (pink, butter yellow, mint) tag every craft and tool. Single light look on purpose. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #57303f;
  --muted: #9a6b7d;
  --pink: #f294b5;
  --pink-deep: #e0659a;
  --blush: #fde4ee;
  --petal: #f9c6d8;
  --butter: #fde58f;
  --butter-soft: #fff6d2;
  --butter-deep: #a87810;
  --mint: #bfe3b4;
  --mint-soft: #e8f6e1;
  --mint-deep: #4f8d47;
  --white: #ffffff;
  --cut: drop-shadow(0 4px 5px rgba(205, 95, 135, .16));
  --font-display: "Gochi Hand", "Cooper Black", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Quicksand", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-sign: "DM Serif Display", Georgia, "Times New Roman", serif;
}
.tone-pink   { --t-soft: var(--blush);       --t-mid: var(--petal); --t-deep: var(--pink-deep); }
.tone-yellow { --t-soft: var(--butter-soft); --t-mid: var(--butter); --t-deep: var(--butter-deep); }
.tone-green  { --t-soft: var(--mint-soft);   --t-mid: var(--mint);  --t-deep: var(--mint-deep); }

* { box-sizing: border-box; }
html { background: #fffbea; }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.55; font-weight: 600; color: var(--ink);
  background-color: #fffbea;
  background-image:
    linear-gradient(90deg, rgba(242,148,181,.14) 50%, transparent 50%),
    linear-gradient(rgba(191,227,180,.22) 50%, transparent 50%);
  background-size: 30px 30px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 30px;
}
.app {
  max-width: 1060px; margin: 0 auto; background: var(--bg);
  border-radius: 36px; padding: 26px 30px 40px;
  box-shadow: 0 0 0 6px #fff, 0 0 0 9px var(--butter), 0 18px 40px rgba(200, 120, 90, .16);
}
@media (max-width: 560px) { .app { padding: 18px 14px 30px; border-radius: 28px; } }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; border-radius: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.stk { display: block; width: 100%; height: 100%; overflow: visible; filter: var(--cut); }
.word {
  font-family: var(--font-display); color: var(--pink); line-height: 1.05; display: inline-block; letter-spacing: .01em; font-weight: 400;
  -webkit-text-stroke: .6px #e98aab;
  text-shadow: 4px 0 #fff, -4px 0 #fff, 0 4px #fff, 0 -4px #fff, 3px 3px #fff, -3px -3px #fff, 3px -3px #fff, -3px 3px #fff;
  filter: drop-shadow(0 4px 5px rgba(170, 70, 110, .28));
}
.word.y { color: #f8cf4f; -webkit-text-stroke-color: #d9a826; }
.word.g { color: #a6d596; -webkit-text-stroke-color: #6fa765; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; margin: -4px 0 6px; }
.brand-bow { width: 44px; height: 44px; transform: rotate(-12deg); }
.brand-word { font-family: var(--font-display); font-size: 32px; line-height: 1; color: var(--ink); letter-spacing: .01em; }
.brand-word em { font-style: normal; color: var(--pink-deep); }
.brand-dots { display: inline-flex; gap: 4px; margin-left: 2px; }
.brand-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); }
.brand-dots i:nth-child(2) { background: var(--butter); }
.brand-dots i:nth-child(3) { background: var(--mint); }

/* hero sticker sheet */
.sheet { position: relative; height: 300px; margin-bottom: 4px; }
.sheet > * { position: absolute; }
.h-jar { width: 140px; height: 140px; left: 0; top: 6px; transform: rotate(-4deg); }
.h-duck { width: 120px; height: 120px; left: 19%; top: 0; transform: rotate(5deg); }
.h-hib { width: 130px; height: 120px; left: 36%; top: 6px; transform: rotate(-6deg); }
.h-daisy { width: 92px; height: 92px; left: 55%; top: 0; transform: rotate(10deg); }
.h-ball { width: 92px; height: 92px; left: 68%; top: 20px; }
.h-fly { width: 130px; height: 104px; right: 0; top: 16px; transform: rotate(-8deg); }
.h-frog { width: 100px; height: 100px; left: 4%; top: 170px; transform: rotate(-8deg); }
.h-cher { width: 90px; height: 98px; left: 18%; top: 168px; transform: rotate(6deg); }
.h-cuc { width: 76px; height: 76px; left: 30%; top: 210px; transform: rotate(-10deg); }
.h-uke { width: 180px; height: 72px; left: 41%; top: 200px; transform: rotate(-10deg); }
.h-boba { width: 84px; height: 100px; left: 64%; top: 150px; transform: rotate(8deg); }
.h-tulip { width: 64px; height: 110px; right: 2%; top: 150px; transform: rotate(6deg); }
.h-yarn { width: 84px; height: 84px; left: 57%; top: 214px; transform: rotate(8deg); }
.h-cake { width: 96px; height: 96px; left: 82%; top: 108px; transform: rotate(-8deg); }
.h-xo { font-size: 54px; left: 74%; top: 236px; transform: rotate(-4deg); }
.h-pr { font-size: 40px; left: 35%; top: 138px; transform: rotate(-4deg); }
.h-y { font-size: 30px; left: 2%; top: 140px; transform: rotate(5deg); }
.bob { animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { translate: 0 -5px; } }
@media (max-width: 680px) {
  .sheet { height: 262px; }
  .h-jar { width: 96px; height: 96px; }
  .h-duck { width: 90px; height: 90px; left: 28%; }
  .h-hib { display: none; }
  .h-daisy { width: 64px; height: 64px; left: auto; right: 90px; top: 4px; }
  .h-ball { display: none; }
  .h-fly { width: 86px; height: 70px; top: 50px; }
  .h-frog { width: 72px; height: 72px; left: 0; top: 160px; }
  .h-cher { width: 62px; height: 68px; left: 25%; top: 184px; }
  .h-cuc { display: none; }
  .h-uke { width: 120px; height: 48px; left: 44%; top: 210px; }
  .h-boba { width: 60px; height: 72px; left: auto; right: 6px; top: 140px; }
  .h-tulip { display: none; }
  .h-yarn { width: 60px; height: 60px; left: 4%; top: 236px; }
  .h-cake { display: none; }
  .h-xo { font-size: 36px; left: auto; right: 72px; top: 160px; }
  .h-pr { font-size: 28px; left: 30%; top: 112px; }
  .h-y { font-size: 22px; left: 2px; top: 112px; }
}
.spark { position: absolute; color: var(--pink); font-size: 20px; line-height: 1; pointer-events: none; animation: twinkle 2.6s ease-in-out infinite; }
.spark.gd { color: #f2c94c; }
.spark.mn { color: #8cc77c; }
.spark.s { font-size: 13px; }
@keyframes twinkle { 50% { opacity: .35; transform: scale(.7) rotate(20deg); } }

/* level + stats */
.status { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; margin-bottom: 22px; }
.level { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 14px; background: var(--butter-soft); border-radius: 22px; padding: 12px 16px; border: 2px dashed var(--butter); }
.level .medal { width: 52px; height: 52px; flex: none; }
.level .lv-txt { min-width: 0; flex: 1; }
.level small { display: block; font-size: 12px; color: var(--butter-deep); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.level strong { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--pink-deep); line-height: 1.1; }
.lv-bar { height: 8px; border-radius: 99px; background: #fff; margin-top: 6px; overflow: hidden; }
.lv-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--butter), var(--pink)); border-radius: 99px; }
.lv-next { font-size: 12px; color: var(--muted); margin-top: 3px; }
.pills { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { background: var(--white); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; color: var(--muted); box-shadow: 0 0 0 2px var(--blush), 0 3px 8px rgba(150,70,100,.10); }
.pill b { color: var(--pink-deep); font-variant-numeric: tabular-nums; }

/* craft of the day */
.cotd { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: center; background: var(--t-soft); border-radius: 30px; padding: 20px 24px; margin-bottom: 30px; position: relative; text-align: left; border: 0; width: 100%; }
.cotd .tag { position: absolute; top: -14px; left: 26px; transform: rotate(-3deg); font-size: 26px; }
.cotd .c-art { width: 150px; height: 150px; transform: rotate(-6deg); }
.cotd h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; color: var(--t-deep); font-size: 30px; line-height: 1.1; text-wrap: balance; }
.cotd p { margin: 0 0 10px; color: var(--muted); max-width: 52ch; }
@media (max-width: 560px) { .cotd { grid-template-columns: 1fr; justify-items: center; text-align: center; padding-top: 28px; } .cotd .c-art { width: 120px; height: 120px; } .cotd .meta { justify-content: center; } }

/* make-it studio row */
.row-title { font-size: 34px; margin: 0 0 18px; transform: rotate(-2deg); }
.studio { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 34px; }
.tool { position: relative; border: 0; border-radius: 26px; background: var(--t-soft); padding: 16px 18px 18px; text-align: left; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; align-items: center; transition: transform .2s; box-shadow: inset 0 -4px 0 var(--t-mid); }
.tool:hover { transform: translateY(-3px) rotate(-.5deg); }
.tool .t-art { width: 74px; height: 74px; }
.tool b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--t-deep); line-height: 1.1; }
.tool span { font-size: 14px; color: var(--muted); }
.tool .new { position: absolute; top: -10px; right: 14px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 9px; border-radius: 99px; transform: rotate(5deg); box-shadow: 0 0 0 3px #fff; }

/* controls */
.controls { display: flex; flex-direction: column; gap: 14px; margin: 0 0 26px; }
.search { display: flex; align-items: center; gap: 10px; background: #fffdf5; border: 2px solid var(--butter); border-radius: 999px; padding: 11px 18px; }
.search svg { width: 20px; height: 20px; flex: none; color: var(--pink); }
.search input { border: 0; background: transparent; outline: none; font: inherit; color: var(--ink); width: 100%; min-width: 0; }
.search input::placeholder { color: var(--muted); font-weight: 500; }
.chips { display: flex; gap: 12px; overflow-x: auto; padding: 6px 6px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--white); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; color: var(--t-deep); white-space: nowrap;
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--t-soft), 0 4px 10px rgba(150,70,100,.16), inset 0 -3px 0 var(--t-soft); transition: transform .15s; }
.chip:nth-child(odd) { transform: rotate(-2deg); }
.chip:nth-child(even) { transform: rotate(2deg); }
.chip:hover { transform: rotate(0) scale(1.05); }
.chip[aria-pressed="true"] { background: var(--t-mid); color: var(--ink); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--t-mid), 0 4px 10px rgba(150,70,100,.2), inset 0 -3px 0 rgba(0,0,0,.06); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 30px 22px; }
@media (max-width: 500px) { .grid { grid-template-columns: 1fr 1fr; gap: 24px 12px; } }
.card { background: none; border: 0; padding: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; }
.pad { position: relative; width: 88%; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; }
.pad::before { content: ""; position: absolute; inset: 6%; border-radius: 58% 42% 52% 48% / 46% 56% 44% 54%; background: var(--t-soft); transition: transform .3s; }
.card:nth-child(2n) .pad::before { border-radius: 44% 56% 46% 54% / 56% 44% 56% 44%; background-image: radial-gradient(var(--t-mid) 1.8px, transparent 2px); background-size: 14px 14px; }
.pad::after { content: "✦"; position: absolute; top: 4%; right: 8%; color: #f2c94c; font-size: 16px; opacity: 0; transition: opacity .2s; }
.card:hover .pad::after { opacity: 1; }
.card:hover .pad::before { transform: rotate(8deg) scale(1.04); }
.card .art { position: relative; width: 84%; height: 84%; transition: transform .25s; }
.card:nth-child(3n+1) .art { transform: rotate(-5deg); }
.card:nth-child(3n+2) .art { transform: rotate(4deg); }
.card:nth-child(3n) .art { transform: rotate(-2deg); }
.card:hover .art { transform: rotate(0) scale(1.06); }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--t-deep); font-size: 20px; line-height: 1.15; text-wrap: balance; max-width: 18ch; letter-spacing: .01em; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.meta span { background: var(--t-soft, var(--blush)); padding: 2px 10px; border-radius: 999px; }
.badge { position: absolute; top: 0; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--white); color: var(--pink-deep); box-shadow: 0 0 0 2px var(--blush), 0 2px 6px rgba(150,70,100,.18); }
.badge.l { left: 0; transform: rotate(-6deg); background: var(--mint-soft); color: var(--mint-deep); box-shadow: 0 0 0 2px var(--mint), 0 2px 6px rgba(80,140,70,.18); }
.badge.r { right: 0; transform: rotate(6deg); }
.badge.n { left: 0; transform: rotate(-6deg); background: var(--butter); color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(160,120,30,.2); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; grid-column: 1 / -1; }
.empty .word { font-size: 34px; margin-bottom: 10px; }

/* shared detail bits */
.back { display: inline-flex; align-items: center; gap: 6px; background: var(--white); border: 0; border-radius: 999px; padding: 7px 16px 7px 10px; font-weight: 700; font-size: 14px; color: var(--pink-deep); box-shadow: 0 0 0 3px #fff, 0 3px 8px rgba(150,70,100,.22); }
.back svg { width: 18px; height: 18px; }
.detail { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 34px; margin-top: 24px; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; gap: 20px; } }
.d-side { display: flex; flex-direction: column; align-items: center; gap: 16px; }
@media (min-width: 761px) { .d-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.d-pad { position: relative; width: min(320px, 78%); aspect-ratio: 1 / 1; display: grid; place-items: center; }
.d-pad::before { content: ""; position: absolute; inset: 2%; border-radius: 58% 42% 52% 48% / 46% 56% 44% 54%; background-color: var(--t-soft); background-image: radial-gradient(#fff 2px, transparent 2.2px); background-size: 18px 18px; }
.d-art { position: relative; width: 82%; height: 82%; transform: rotate(-4deg); }
.d-main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.d-title { font-size: clamp(36px, 6vw, 52px); margin: 0; transform: rotate(-1.5deg); transform-origin: left; text-wrap: balance; }
.d-intro { margin: 0; color: var(--muted); max-width: 60ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 10px 20px; font-weight: 700; border: 0; background: var(--white); color: var(--pink-deep);
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--petal), 0 4px 10px rgba(150,70,100,.2); transition: transform .15s; }
.btn:hover { transform: translateY(-2px); }
.btn.solid { background: var(--pink); color: var(--white); }
.btn.yel { background: var(--butter); color: var(--ink); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f6dd86, 0 4px 10px rgba(160,120,30,.2); }
.btn.mint { background: var(--mint); color: var(--ink); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #a9d79c, 0 4px 10px rgba(80,140,70,.2); }
.btn svg { width: 18px; height: 18px; }
.panel { position: relative; background: color-mix(in srgb, var(--t-soft, var(--blush)) 55%, #fff); border-radius: 26px; padding: 26px 20px 20px; border: 2px solid var(--t-soft, var(--blush)); }
.panel::before { content: ""; position: absolute; top: -13px; left: 50%; width: 96px; height: 24px; translate: -50% 0; rotate: -3deg; border-radius: 3px;
  background: repeating-linear-gradient(45deg, rgba(242,148,181,.85) 0 7px, rgba(253,228,238,.95) 7px 14px); box-shadow: 0 2px 4px rgba(150,70,100,.12); }
.panel.tp-y::before { rotate: 4deg; left: 30%; background: repeating-linear-gradient(90deg, rgba(253,229,143,.95) 0 10px, rgba(255,255,255,.95) 10px 20px); }
.panel.tp-g::before { rotate: -5deg; left: 70%; background-color: rgba(232,246,225,.98); background-image: radial-gradient(rgba(140,199,124,.9) 2px, transparent 2.4px); background-size: 9px 9px; }
.panel h2 { font-size: 30px; margin: 0 0 12px; }
.supplies { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.supplies li { display: flex; gap: 10px; align-items: baseline; }
.supplies li::before { content: "♡"; color: var(--pink); font-weight: 700; }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 12px; border-radius: 999px; background: var(--white); overflow: hidden; box-shadow: inset 0 0 0 2px var(--blush); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--butter), var(--pink)); border-radius: 999px; transition: width .35s; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 18px; background: var(--white); }
.step input { position: absolute; opacity: 0; pointer-events: none; }
.step .tick { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 19px; color: var(--pink-deep); background: var(--blush); cursor: pointer; }
.step:nth-child(3n+2) .tick { background: var(--butter-soft); color: var(--butter-deep); }
.step:nth-child(3n) .tick { background: var(--mint-soft); color: var(--mint-deep); }
.step input:focus-visible + .tick { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
.step.on .tick { background: var(--mint); color: var(--ink); }
.step .txt { min-width: 0; }
.step .txt b { display: block; font-weight: 700; }
.step .txt span { color: var(--muted); font-size: 15px; font-weight: 500; }
.step.on .txt b { text-decoration: line-through; text-decoration-color: var(--pink); text-decoration-thickness: 2px; }
.tip { margin-top: 14px; padding: 12px 16px; border-radius: 18px; background: var(--butter-soft); font-size: 15px; }
.tip b { color: var(--butter-deep); }
.safety { background: var(--white); border-radius: 18px; padding: 12px 16px; font-size: 15px; box-shadow: 0 0 0 2px var(--petal); }
.safety b { color: var(--pink-deep); }
.celebrate { text-align: center; }
.celebrate .word { font-size: 40px; }
.celebrate p { margin: 8px 0 14px; color: var(--muted); }
.unlock { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--mint-deep); }
.unlock .u-art { width: 40px; height: 40px; }

/* studio pages */
.studio-page { margin-top: 22px; }
.studio-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.studio-head h1 { font-size: clamp(36px, 6vw, 52px); margin: 0; transform: rotate(-1.5deg); transform-origin: left; }
.studio-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.maker { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 30px; align-items: start; }
@media (max-width: 760px) { .maker { grid-template-columns: 1fr; } }
.preview { background-color: var(--t-soft); background-image: radial-gradient(#fff 2px, transparent 2.2px); background-size: 18px 18px; border-radius: 30px; padding: 24px; display: grid; place-items: center; }
@media (min-width: 761px) { .preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.preview svg.hanger { width: min(240px, 70vw); height: auto; filter: drop-shadow(0 6px 10px rgba(150,70,100,.18)); }
.opts { display: flex; flex-direction: column; gap: 22px; }

/* duck dress-up */
.duck-stage { background-color: var(--butter-soft); background-image: linear-gradient(90deg, rgba(253,229,143,.5) 50%, transparent 50%), linear-gradient(rgba(253,229,143,.5) 50%, transparent 50%); background-size: 24px 24px; border-radius: 30px; padding: 20px; display: grid; place-items: center; }
@media (min-width: 761px) { .duck-stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.duck-stage .card-paper { background: #fff; border-radius: 28px; padding: 10px; box-shadow: 0 6px 14px rgba(160,120,30,.18); }
.duck-stage svg { width: min(260px, 66vw); height: auto; display: block; }
.closet { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.item { border: 0; border-radius: 20px; background: var(--white); padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; box-shadow: 0 0 0 2px var(--t-soft); }

/* sticker book */
.book { background-color: #fffdf6; background-image: repeating-linear-gradient(0deg, transparent 0 34px, rgba(191,227,180,.45) 34px 36px); border-radius: 30px; padding: 24px; border: 2px solid var(--mint); }
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 22px 14px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); background: none; border: 0; padding: 0; }

/* moods */
.moods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 36px; }
.mood { border: 0; background: var(--t-soft); border-radius: 50% 50% 46% 54% / 60% 60% 40% 40%; aspect-ratio: 1 / 1; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px; transform: rotate(var(--tilt)); transition: transform .2s; font-weight: 700; font-size: 14px; color: var(--ink); text-align: center; }
.mood .m-art { width: 56%; height: 56%; }

.mood[aria-pressed="true"] { background: var(--t-mid); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--t-mid); }
@media (max-width: 760px) { .moods { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } .mood { font-size: 11px; padding: 6px; } }
@media (max-width: 500px) { .moods { gap: 10px; } .mood { font-size: 12px; padding: 8px; } }

/* hashtag chips */
.tagchip { flex: none; border: 0; background: none; padding: 6px 4px; font-weight: 700; font-size: 15px; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; }

.grid-note { margin: -10px 0 16px; font-size: 14px; color: var(--muted); min-height: 1px; }

.linkish { border: 0; background: none; padding: 0; color: var(--pink-deep); text-decoration: underline; font-weight: 700; }

/* masonry pins */

.stamp { position: absolute; right: 10px; top: 12px; border: 2px solid var(--mint-deep); color: var(--mint-deep); font-family: var(--font-display); font-size: 16px; padding: 0 8px; border-radius: 8px; transform: rotate(10deg); background: rgba(255,255,255,.7); }
.pin-title { font-weight: 700; font-size: 15px; line-height: 1.3; padding: 0 4px; color: var(--ink); text-wrap: balance; }
.pin-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; }
.hash { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin-save { flex: none; border: 0; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 700; background: var(--pink-deep); color: #fff; }

/* story tutorial */
.story { max-width: 560px; margin: 18px auto 0; display: flex; flex-direction: column; gap: 12px; }
.bars { display: flex; gap: 5px; }
.bars i { flex: 1; height: 5px; border-radius: 99px; background: var(--t-soft); }

.story-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.cover-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 46px); line-height: 1.05; color: var(--ink); text-wrap: balance; }

  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%; }
.r-head { text-align: center; font-weight: 700; letter-spacing: .12em; padding-bottom: 8px; border-bottom: 1.5px dashed #d9c3cb; margin-bottom: 8px; }
.r-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }

.r-total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1.5px dashed #d9c3cb; margin-top: 8px; padding-top: 8px; }

.stepcard { display: flex; flex-direction: column; gap: 14px; flex: 1; }

.step-d { margin: 0; font-size: 19px; line-height: 1.55; font-weight: 500; max-width: 34ch; }
.sticky-note { background: var(--butter); padding: 14px 16px 16px; width: min(260px, 100%); transform: rotate(2deg); box-shadow: 0 6px 12px rgba(160,120,30,.18); font-size: 15px; font-weight: 600; }
.sticky-note b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--ink); }

@media (max-width: 500px) { .slide { min-height: 480px; padding: 22px 18px; } .step-num { font-size: 88px; } .step-d { font-size: 17px; } .step-art { width: 110px; height: 110px; } }
.finish { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }

.polaroid { position: relative; background: #fff; padding: 12px 12px 14px; width: 230px; max-width: 100%; box-shadow: 0 8px 18px rgba(120,60,80,.16); transform: rotate(var(--tilt, -3deg)); border: 0; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 70px; height: 20px; translate: -50% 0; rotate: 4deg; background: repeating-linear-gradient(45deg, rgba(242,148,181,.8) 0 6px, rgba(253,229,143,.9) 6px 12px); }
.pol-img { display: grid; place-items: center; aspect-ratio: 1 / 1; background: var(--t-soft, var(--blush)); }

/* board */
.board { background-color: #fffdf6; background-image: radial-gradient(rgba(242,148,181,.35) 1.6px, transparent 1.8px); background-size: 22px 22px; border-radius: 30px; padding: 34px 20px; border: 2px solid var(--mint); }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 34px 20px; justify-items: center; }

.board-count { font-weight: 700; color: var(--mint-deep); }

/* squishy shelf */

.shelf { display: flex; gap: 14px; overflow-x: auto; padding: 14px 6px 22px; margin-bottom: 22px; scroll-snap-type: x proximity; background: linear-gradient(transparent 76%, var(--mint-soft) 76%, var(--mint-soft) 90%, #d6edcc 90%); border-radius: 0 0 18px 18px; }

/* new features */

.room-pick { border: 0; background: #fff; border-radius: 22px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; box-shadow: 0 0 0 2px var(--blush); }

.rp-art { width: 64px; height: 64px; }
.sw-row { display: flex; gap: 4px; }

.glow b { color: var(--pink-deep); font-variant-numeric: tabular-nums; }
.bm-svg { width: min(170px, 46vw); height: auto; filter: drop-shadow(0 6px 10px rgba(150,70,100,.18)); }
.sq-prev { display: flex; flex-direction: column; gap: 10px; }

@keyframes squish { 0% { transform: scale(1); } 12% { transform: scale(1.18, .7); } 100% { transform: scale(1); } }
.sq-name { font-family: var(--font-display); font-size: 28px; color: var(--butter-deep); }
.br-svg { width: min(300px, 80vw); height: auto; }

.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--butter); font-weight: 700; font-size: 17px; line-height: 1; }

.trade-text { white-space: pre-wrap; background: #fff; border-radius: 14px; padding: 12px; font-size: 13px; margin: 14px 0 10px; overflow-x: auto; }

.drop { background: linear-gradient(135deg, var(--butter-soft), var(--blush) 60%, var(--mint-soft)); border-radius: 30px; padding: 20px 22px 22px; margin-bottom: 34px; }
.drop-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 14px; }

.drop-item { border: 0; background: rgba(255,255,255,.85); border-radius: 20px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-align: center; }
.d-mini { width: 64px; height: 64px; }
.pin-cost { position: absolute; right: 10px; bottom: 10px; border-radius: 99px; font-size: 12px; font-weight: 700; padding: 2px 9px; background: rgba(255,255,255,.85); }
.pin-cost.c-free { background: var(--mint); color: var(--ink); }
.pin-cost.c-5 { background: var(--butter); color: var(--ink); }
.friend-btn { margin-top: 4px; }

.shop-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
.shop-list { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }

const RATIOS = ["4 / 5", "1 / 1", "3 / 4", "5 / 6", "4 / 5", "6 / 7"];
function renderGrid() {
  const q = query.trim().toLowerCase();
  let list = T.filter(t => cat === "all" || (cat === "saved" ? state.saved.includes(t.id) : cat === "new" ? t.isNew : cat === "quick" ? t.mins <= 20 : cat === "free" ? costOf(t) === "free" : cat === "safe" ? isSafe(t) : cat === "cheap" ? costOf(t) !== "15" : t.cat === cat));
  if (mood) { const m = MOODS.find(x => x.id === mood); list = list.filter(t => m.ids ? m.ids.includes(t.id) : t.mins <= 20); }
  const q2 = q.length > 3 && q.endsWith("s") ? q.slice(0, -1) : q;
  if (q) list = list.filter(t => { const hay = (t.title + " " + t.intro + " " + t.supplies.join(" ") + " " + t.cat).toLowerCase(); return hay.includes(q) || hay.includes(q2); });
  const m = mood && MOODS.find(x => x.id === mood);
  $("#gridNote").innerHTML = m ? `Showing <b>${m.name.toLowerCase()}</b> crafts · <button class="linkish" data-mood="${m.id}">show all</button>` : "";
  if (!list.length) {
    const savedEmpty = cat === "saved" && !q;
    $("#grid").innerHTML = `<div class="empty"><span class="word">${savedEmpty ? "no pins yet" : "no crafts found"}</span><br>${savedEmpty ? "Tap \"Pin it\" on any craft to keep it on your board." : "Try a different word, like squishy, crochet or bookmark."}</div>`;
    return;
  }
  $("#grid").innerHTML = list.map((t, i) => {
    const pinned = state.saved.includes(t.id), made = state.made.includes(t.id);
    return `<article class="pin tone-${t.tone}">
      <button class="pin-open" data-go="${t.id}" aria-label="Open ${esc(t.title)}">
        <span class="pin-tile" style="aspect-ratio:${RATIOS[(i + t.title.length) % RATIOS.length]}">${art(t.st, "pin-art")}
          ${made ? `<span class="stamp">made it</span>` : t.isNew ? `<span class="fresh">new</span>` : ""}
          <span class="pin-time">${t.time}</span><span class="pin-cost c-${costOf(t)}">${COST_LABEL[costOf(t)]}</span>
        </span>
        <span class="pin-title">${esc(t.title)}</span>${supplyMatch(t, q) ? `<span class="uses">uses ${esc(supplyMatch(t, q))}</span>` : ""}

      <div class="pin-foot"><span class="hash">#${TAG[t.cat]} #${t.level.toLowerCase()}</span>
        <button class="pin-save ${pinned ? "on" : ""}" data-pin="${t.id}" aria-pressed="${pinned}">${pinned ? "Pinned" : "Pin it"}</button></div>
    </article>`;
  }).join("");
}

/* tutorial: swipe-through story */
let slide = 0;
function slidesFor(t) { return 1 + t.steps.length + (DETAIL[t.id] ? 1 : 0) + 1; }
function renderStory(t, keepSlide) {
  const total = slidesFor(t);
  if (!keepSlide) slide = Math.min(state.steps[t.id] || 0, total - 1);
  const pinned = state.saved.includes(t.id), made = state.made.includes(t.id);
  const bars = Array.from({ length: total }, (_, i) => `<i class="${i <= slide ? "on" : ""}"></i>`).join("");
  let body = "";
  if (slide === 0) {
    const extra = t.id === "door-hangers" ? `<button class="btn yel" data-go="studio-hanger">Design it in the Door Hanger Maker</button>` : (t.id === "paper-duck" || t.id === "mini-skincare") ? `<button class="btn yel" data-go="studio-duck">Plan outfits in Paper Duck Dress-Up</button>` : t.tpl ? `<button class="btn yel" data-go="tpl-${t.tpl}">Print the template</button>` : "";
    body = `<div class="cover">
        <div class="cover-art">${art(t.st, "c-art")}</div>
        <p class="kicker">#${TAG[t.cat]} · ${t.level} · ${t.time} · ${COST_LABEL[costOf(t)]}</p>
        <h1 class="cover-title">${esc(t.title)}</h1>
        <p class="cover-intro">${esc(t.intro)}</p>
        ${DETAIL[t.id] ? `<div class="prep"><b>Before you start</b>${esc(DETAIL[t.id].prep)}</div>` : ""}
        ${t.safety ? `<p class="heads-up"><b>Heads up:</b> ${esc(t.safety)}</p>` : ""}
        ${basicsFor(t).length ? `<div class="learn"><b>New to this?</b>${basicsFor(t).map(id => { const b = T.find(x => x.id === id); return `<button class="learn-chip" data-go="${id}">Learn: ${esc(b.title.replace(/^How to /, ""))}</button>`; }).join("")}</div>` : ""}
        <div class="opt-row cover-tools">${canSpeak ? `<button class="btn read-btn" id="readBtn">🔊 Read it to me</button>` : ""}${SCALABLE.includes(t.cat) ? `<span class="batch" role="group" aria-label="Recipe size"><span>Make:</span><button data-batch="1" aria-pressed="${batch === 1}">1x</button><button data-batch="2" aria-pressed="${batch === 2}">2x</button></span>` : ""}</div>
        ${batch === 2 && SCALABLE.includes(t.cat) ? `<p class="batch-note">Doubled! Use two pans or work in batches. Times stay the same.</p>` : ""}
        <div class="receipt" aria-label="Supplies">

    const dt = DETAIL[t.id];
    body = `<div class="extras">
        <h2 class="ex-h">if something goes wrong</h2>

        <ul class="ideas">${dt.ideas.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      </div>`;
  } else {
    body = `<div class="finish">

          <div class="pol-cap">${made ? `${friendMode ? "We" : "I"} made the ${esc(t.title)}!` : `${esc(t.title)}`}</div>

  $("#view").innerHTML = `${backBtn}
    <div class="story tone-${t.tone}">
      <div class="bars" aria-hidden="true">${bars}</div>
      <div class="story-top"><span class="story-name">${esc(t.title)}</span>

      <div class="slide" aria-live="polite">${body}</div>
      <div class="story-nav">
        <button class="btn" id="prevSlide" ${slide === 0 ? "disabled" : ""}>Back</button>
        <span class="story-count">${slide + 1} / ${total}</span>
        ${slide < total - 1 ? `<button class="btn solid" id="nextSlide">${slide === 0 ? "Let's start" : "Next"}</button>` : `<button class="btn solid" data-go="">Done</button>`}
      </div>
    </div>`;
  state.steps[t.id] = slide; persist();
}
function pickNext(t) {
  const pool = T.filter(x => x.id !== t.id && !state.made.includes(x.id));
  const same = pool.filter(x => x.cat === t.cat);
  const from = same.length ? same : pool.length ? pool : T.filter(x => x.id !== t.id);
  return from[(t.title.length + state.made.length) % from.length];
}

    fix: FOAM_FIX, ideas: ["Make a whole bunch and glue them together at the top.", "Paint brown freckles for a ripe banana.", "Make a peeled banana with white foam sticking out."] },
  "melonpan-squishy": { prep: FOAM_PREP,
    more: ["Trace a mug or a small bowl for a good bun size.", "Press the chopstick in firmly and hold for a few seconds so the lines stay.", "Paint the bottom edge a bit darker so it looks baked.", "Use an almost-dry brush with very little paint and sweep it lightly across the top."],
    fix: FOAM_FIX, ideas: ["Make a chocolate melon pan with brown paint.", "Add a cat face for a kawaii neko bun.", "Make a matcha version in pastel green."] },
  "duck-stress-ball": { prep: "Do this over a tray or the sink, because flour gets everywhere. Make sure nobody helping has a latex allergy.",
    more: ["A funnel helps a lot. You can make one from a rolled-up piece of paper.", "Stretching the balloon first makes it much easier to fill.", "Tie the knot as close to the flour as you can so it stays tight and round.", "The second balloon hides the knot and makes it stronger. Cut its neck off first.", "Draw the eyes a little above the middle and the beak just below. Let the marker dry before squishing."],
    fix: BALLOON_FIX, ideas: ["Make a whole duck family in different colors.", "Use rice instead of flour for a crunchy feel.", "Add a tiny bow sticker on its head."] },
  "peach-stress-ball": { prep: "Do this over a tray or the sink, because cornstarch gets everywhere. Make sure nobody helping has a latex allergy.",
    more: ["Cornstarch makes it feel smooth and doughy, almost like mochi.", "Cut the neck off the second balloon so it slides over like a sweater.", "Press a gentle line down one side with your thumb and hold it to make the peach crease.", "Felt stays on better than paper. A glue dot works better than glue.", "Draw the face on the opposite side from the crease."],
    fix: BALLOON_FIX, ideas: ["Make a strawberry with red balloons and tiny seed dots.", "Make an orange with a leaf on top.", "Write your friend's initial on it as a gift."] },
  "ice-cube-squishy": { prep: "Make slime with a grown-up and wash your hands after. Cover the table, and make sure nobody has a latex allergy.",
    more: ["Add contact solution one small squirt at a time. Too much makes it hard and rubbery.", "If it's sticky, add a few more drops of solution and keep kneading for 2 to 3 minutes.", "Push small balls of slime in one at a time. Squeezing the bottle helps.", "Squeeze out as much air as you can before tying so it looks clear.", "Press it on the table on all six sides to make it square."],
    fix: [["The slime is too sticky", "Add a few more drops of contact solution and knead longer."], ["The slime is too hard", "Knead in a little lotion or warm water."], ["It looks cloudy", "Let it sit for a day or two. The bubbles go away and it gets clearer."]],
    ideas: ["Add a tiny bit of glitter for a sparkly ice cube.", "Use pastel food coloring for jelly cubes.", "Make a set of three in different colors."] },
  "carrot-squishy": { prep: FOAM_PREP,
    more: ["Make it about 6 in long and 2 in wide at the top.", "Turn it as you trim so it's round all the way around.", "Orange can look see-through at first, so it might need 3 coats.", "Short curved lines look best. Don't go all the way around.", "Push the leaves into a small slit at the top before gluing so they stay in."],
    fix: FOAM_FIX, ideas: ["Make a radish in pink and white.", "Give it a face for a kawaii carrot.", "Make a bunch tied with ribbon."] },
  "shortcake-squishy": { prep: FOAM_PREP,
    more: ["A triangle about 4 in long and 3 in wide at the back looks like a real slice.", "Thick foam is hard to cut, so this part is a grown-up job.", "Squeeze while the paint is wet. That's the secret to keeping squishies bendy.", "Use painter's tape to make a straight line for the pink filling stripe.", "Pipe the frosting in little swirls or a wavy line along the back edge.", "If it rises slowly, you used real memory foam. If it bounces back, it's regular foam."],
    fix: FOAM_FIX, ideas: ["Chocolate cake with brown paint.", "Add tiny sprinkles with a toothpick and puffy paint.", "Make a full round cake from 8 slices."] },
  "toast-squishy": { prep: FOAM_PREP,
    more: ["Trace a real slice of bread for the perfect shape.", "Round the corners a little so it looks puffy.", "Let the crust dry before painting the middle so the colors don't mix.", "Seeds look best as tiny yellow teardrops.", "Rosy pink cheeks next to the face make it extra cute."],
    fix: FOAM_FIX, ideas: ["Avocado toast with a green circle.", "Egg toast with a white and yellow fried egg.", "Make a toaster from a tissue box!"] },
  "crochet-heart": { prep: "Use a smooth, light-colored cotton yarn so you can see your stitches. Leave a 6 in tail when you start.",
    more: ["Hold the tail with your thumb so the ring doesn't slip.", "Treble crochet: wrap the yarn around the hook twice before going into the ring.", "This middle point is what makes the bottom of the heart.", "This half should match the first half, just in reverse order.", "Pull the tail slowly. The two bumps of the heart pop out as the ring closes.", "Weave the ends through 3 or 4 stitches in different directions so they don't come loose."],
    fix: [["The ring won't close", "You may have crocheted over the tail. Make sure the tail is free and only goes through the ring."], ["My heart looks lopsided", "Count your stitches on both sides. They should match."], ["My stitches are too tight", "Relax your hands and try a bigger hook."]],
    ideas: ["Make a heart garland in pink, yellow and mint.", "Glue one onto a hair clip.", "Use sparkly yarn for a glitter heart."] },
  "crochet-flower": { prep: "You'll need two colors. Practice the magic ring first if it's new to you.",
    more: ["Count to 10 out loud as you go. It's easy to lose count!", "Pull a loop of white through, then tie the yellow and white tails together in a tiny knot.", "Each petal takes up one stitch of the yellow middle.", "Keep the petals the same size by using the same tension on each one.", "Hide the ends behind the flower before you cut them.", "Hot glue holds best, but ask a grown-up, or use strong craft glue and let it dry."],
    fix: [["The middle has a hole", "Pull the magic ring tail tighter, then weave it in."], ["The petals are floppy", "Use a smaller hook or cotton yarn, which is stiffer."], ["I ended up with 6 petals", "Totally fine! Six-petal flowers are cute too."]],
    ideas: ["Pink petals for a cherry blossom.", "Make three and sew them onto a tote bag.", "Add a green leaf with a few chain stitches."] },
  "crochet-bow": { prep: "This only uses chain and single crochet, so it's great for beginners. Leave a long tail at the end.",
    more: ["Keep your chains loose so the first row is easier.", "Skipping the first chain makes the edge neat.", "Turning means flipping your work over so you crochet back the other way.", "Leave about 12 in of yarn when you cut. You'll need it to wrap the middle.", "Wrap tightly. The tighter you wrap, the puffier the bow looks.", "Double knot it so the bow stays on."],
    fix: [["The edges are wavy", "You may be adding or skipping stitches. Count 20 every row."], ["The bow looks flat", "Wrap the middle tighter and fluff the loops."], ["It's too big", "Start with fewer chains, like 15 or 11."]],
    ideas: ["Make tiny ones for earrings or a keychain.", "Make a big one for a backpack.", "Use two colors and switch halfway."] },
  "flower-bookmark": { prep: "Pick flowers on a dry day. Flat flowers like pansies and daisies press best. Always ask before picking.",
    more: ["Put a few heavy books on top. Check after a week. They should feel papery.", "Use a dot of glue stick to hold each flower in place.", "Smooth from the middle outward to push out air bubbles.", "Leave about 1/8 in of clear tape around the edge so it stays sealed.", "A hole punch works best. Loop the ribbon through and tie a knot."],
    fix: [["The flowers went brown", "They had too much water. Press them longer, or try different flowers."], ["There are bubbles", "Gently push them to the edge with a fingernail or the back of a spoon."], ["The tape peels", "Leave a wider clear border when you trim."]],
    ideas: ["Add a quote with a fine marker.", "Use leaves for a fall bookmark.", "Make one for every friend in your book club."] },
  "corner-bookmark": { prep: "Use paper that's colored on one side. A 6 in square makes a bookmark that fits most books.",
    more: ["Press each fold down hard with your fingernail. Sharp folds make it neater.", "Only fold the top layer. The back layer stays where it is.", "The corners should meet exactly at the top point.", "Tucking them in locks the pocket so it stays together.", "Draw the face on the front flap, then slide it onto the corner of a page."],
    fix: [["It won't stay together", "Make sure the side flaps are fully tucked into the pocket."], ["It's too loose on my book", "Start with a smaller square."], ["The colored side is inside", "Start again with the colored side facing down."]],
    ideas: ["A duck with a yellow square and an orange beak.", "A strawberry with red paper and seed dots.", "A bunny with paper ears on top."] },
  "bow-bookmark": { prep: "Use thin satin ribbon. Thick ribbon makes the book bulge.",
    more: ["Measure against your book first. It should stick out at the top and bottom.", "Make the bow loops the same size, then pull them tight.", "Light charms work best so they don't damage the pages.", "Cutting a V shape stops the ends from fraying."],
    fix: [["The ribbon frays", "Cut a clean V or dab clear nail polish on the ends."], ["The bow comes undone", "Add a tiny stitch or dot of glue in the knot."], ["The charm is too heavy", "Use a smaller charm or a bead instead."]],
    ideas: ["Use two ribbons in different colors.", "Add letter beads with your name.", "Make a matching one for a friend."] },
  "door-hangers": { prep: "Cardstock works best. Measure your doorknob so the hole fits.",
    more: ["Pick words that match your mood, like Busy or Come in.", "If you're drawing it, use a ruler for the straight edges.", "Cut the hole slightly smaller first. You can always make it bigger.", "Tape both sides, smoothing as you go to avoid bubbles.", "If it's tight, snip the slit a tiny bit longer."],
    fix: [["It won't fit my doorknob", "Cut the circle bigger, or make the slit longer."], ["It bends", "Use thicker cardstock or glue two layers together."], ["The colors smudge", "Let the ink dry fully before taping."]],
    ideas: ["Make it two-sided: Busy on one side, Come in on the other.", "Add a dry-erase pocket to write notes.", "Make a set for your whole family."] },
  "paper-duck": { prep: "Paper ducks are drawn on plain paper and covered in tape. Have lots of clear packing tape ready.",
    more: ["A round head on a round body is the easiest shape. Make it about hand-sized.", "Leave a white border around the outline. It makes cutting easier and looks neater.", "Tape the front first, then the back, so no paper edges show.", "Make the accessories the right size by drawing them right on top of your duck shape.", "Small pieces are fiddly. Use small scissors and go slowly.", "A labeled envelope keeps everything from getting lost."],
    fix: [["The tape has wrinkles", "Lay the tape down slowly and smooth it with a ruler."], ["Accessories fall off", "Make little tabs that tuck behind the duck."], ["My duck looks weird", "That's normal! Draw it again. The second one is always better."]],
    ideas: ["Make a bunny or a cat instead.", "Make seasonal outfits like a witch hat.", "Trade accessories with friends."] },
  "mini-skincare": { prep: "Fine-tip markers are best for tiny writing. Use made-up brand names, not real ones.",
    more: ["Pick a theme for your brand, like strawberry or cloud.", "Draw them in a row on one strip of paper to save time.", "Write the tiny words first in pencil, then trace.", "A thin white towel with a stripe looks super cute.", "Cut slowly around the tiny bottle caps."],
    fix: [["My writing is too big", "Write just one word, like Glow, instead of a full sentence."], ["The pieces are too small to cut", "Make them a little bigger. They still look cute."], ["The tape is cloudy", "Use a fresh roll of clear packing tape."]],
    ideas: ["Make a mini makeup set.", "Make a tiny cafe menu and food.", "Make a matching paper storage box."] },
  "daisy-mirror": { prep: "Always ask a grown-up before drawing on a mirror. Paint pens work best on glass.",
    more: ["Ask which mirror is okay and how much you can decorate.", "Fingerprints stop paint from sticking, so clean it well.", "Draw five or six petals around a center dot. They don't need to match.", "Group things in corners instead of all over, so you can still see yourself.", "Don't touch it until it's fully dry."],
    fix: [["The paint is streaky", "Let it dry, then add a second coat."], ["I made a mistake", "Wipe it right away with a damp cotton swab."], ["It's peeling", "Clean the mirror better first, and let each coat dry."]],
    ideas: ["Draw a cloud and rainbow corner.", "Add a cute quote at the top.", "Do the same thing on a window."] },
  "clay-beads": { prep: "Keep beads in a bowl or tray so they don't roll away. Little kids shouldn't play with tiny beads.",
    more: ["Add extra cord so you can tie it easily.", "Try a pattern like 3 pink, 3 yellow, 3 green.", "Check the length by wrapping it around your wrist as you go.", "Pull each knot really tight. A tiny dot of glue helps.", "Mix in one gold bead per bracelet for a fancy look."],
    fix: [["The bracelet broke", "Pre-stretch the cord before beading, and double knot it."], ["Beads keep falling off", "Tape the end or clip it with a binder clip."], ["It's too tight", "Add a few more beads before tying."]],
    ideas: ["Spell out a word with letter beads.", "Make a matching set with your bestie.", "Add a charm in the middle."] },
  "frog-keychain": { prep: "A big dinner fork works best. Thick yarn makes a fluffier pom-pom.",

    fix: [["It's falling apart", "The middle tie wasn't tight enough. Tie it tighter and double knot."], ["It's lopsided", "Keep trimming the longer bits until it's round."], ["The eyes won't stick", "Use tacky glue and hold them for 30 seconds."]],
    ideas: ["Make a chick in yellow.", "Make a bunny with felt ears.", "Make a mini one for earrings."] },
  "bow-garland": { prep: "Measure your wall or headboard first so you know how many bows you'll need.",
    more: ["A piece of cardboard about 14 in long makes measuring fast.", "Make all the loops about the same size so they match.", "Fold the ribbon end in half and cut at an angle.", "Let the twine droop a little in the middle. It looks prettier.", "Start with a bow in the middle, then add the rest outward."],
    fix: [["The bows are lopsided", "Pull the loops gently to even them out."], ["The garland sags too much", "Add a third hook in the middle."], ["The ribbon frays", "Cut the ends at an angle and use satin ribbon."]],
    ideas: ["Add fairy lights between the bows.", "Use pastel pink, yellow and mint ribbon.", "Clip photos between the bows."] },
  "fairy-jar": { prep: "Use a jar with a wide mouth so the lights fit. Only use battery fairy lights.",
    more: ["Small, uneven pieces look more like stained glass.", "Work on one small section at a time so the glue doesn't dry.", "Brush gently so the tissue doesn't tear.", "Bunch the lights up so the glow is even.", "Tie a big bow. A bit of twine underneath looks cozy."],
    fix: [["The tissue is wrinkly", "Brush it flatter while it's wet, or keep the wrinkles. They look cute!"], ["It's not bright enough", "Use lighter tissue colors or more lights."], ["The glue is cloudy", "It dries clear. Wait a bit longer."]],
    ideas: ["Make a set in pink, yellow and green.", "Add pressed flowers under the tissue.", "Write a word on it in paint pen."] },
  "clay-dish": { prep: "Work on a smooth surface like a cutting board. Keep a cup of water nearby for smoothing.",

    ideas: ["Make a heart-shaped dish.", "Paint a strawberry or daisy pattern.", "Add tiny gold dots for sparkle."] },
  "photo-wall": { prep: "Print photos at a small size. Pick 10 to 20 that make you happy.",

    ideas: ["Add fairy lights around it.", "Mix in postcards and magazine cutouts.", "Change the photos every season."] },
  "big-bow-clip": { prep: "Hot glue is hot! Ask a grown-up to help, and keep a cup of water nearby for burns.",

    ideas: ["Make a mini bow version.", "Use velvet for winter.", "Add a pearl in the middle."] },

    fix: [["The elastic slipped inside", "Pin the other end to the fabric before threading."], ["It's too loose", "Use shorter elastic."], ["The seam came apart", "Sew it again with smaller stitches."]],

function spriteSvg(id, size) {

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${size}" height="${size}">${sp.innerHTML}<use href="#${id}" width="100" height="100"/></svg>`;
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function makePolaroid(t) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  try { await document.fonts.load('60px "Gochi Hand"'); } catch (e) {}
  g.fillStyle = "#fffbea"; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 90) { g.fillStyle = "rgba(242,148,181,.16)"; g.fillRect(x, 0, 45, H); }
  for (let y = 0; y < H; y += 90) { g.fillStyle = "rgba(191,227,180,.26)"; g.fillRect(0, y, W, 45); }
  g.save(); g.translate(W / 2, 640); g.rotate(-3 * Math.PI / 180);
  g.shadowColor = "rgba(120,60,80,.25)"; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.fillStyle = "#fff"; g.fillRect(-380, -470, 760, 900); g.shadowColor = "transparent";
  const soft = { pink: "#fde4ee", yellow: "#fff6d2", green: "#e8f6e1" }[t.tone] || "#fde4ee";
  g.fillStyle = soft; g.fillRect(-340, -430, 680, 680);
  if (photoFor(t.id)) { const im = await loadImg(photoFor(t.id)); g.drawImage(im, -340, -430, 680, 680); }
  else { const url = URL.createObjectURL(new Blob([spriteSvg(t.st, 600)], { type: "image/svg+xml" }));
    try { const im = await loadImg(url); g.drawImage(im, -250, -340, 500, 500); } catch (e) {} URL.revokeObjectURL(url); }
  g.fillStyle = "#57303f"; g.textAlign = "center"; g.font = '64px "Gochi Hand", cursive';
  const cap = (state.made.includes(t.id) ? (friendMode ? "We made the " : "I made the ") : "") + t.title + (state.made.includes(t.id) ? "!" : "");
  const words = cap.split(" "); let line = "", lines = [];
  words.forEach(w => { const test = (line + " " + w).trim(); if (g.measureText(test).width > 640 && line) { lines.push(line); line = w; } else line = test; }); lines.push(line);
  lines.slice(0, 2).forEach((l, i) => g.fillText(l, 0, 335 + i * 70 - (lines.length > 1 ? 20 : 0)));
  g.fillStyle = "rgba(242,148,181,.85)"; g.save(); g.translate(0, -470); g.rotate(4 * Math.PI / 180); g.fillRect(-110, -26, 220, 52); g.restore();
  if (state.made.includes(t.id)) { g.save(); g.translate(280, -60); g.rotate(14 * Math.PI / 180); g.strokeStyle = "#4f8d47"; g.lineWidth = 8; g.fillStyle = "rgba(255,255,255,.9)";
    g.beginPath(); g.roundRect(-150, -48, 300, 96, 16); g.fill(); g.stroke(); g.fillStyle = "#4f8d47"; g.font = '700 50px Quicksand, sans-serif'; g.fillText("MADE IT", 0, 18); g.restore(); }
  g.restore();
  g.fillStyle = "#57303f"; g.font = '70px "Gochi Hand", cursive'; g.textAlign = "center";
  const a = "make it ", b = "cute", wa = g.measureText(a).width, wb = g.measureText(b).width, sx = W / 2 - (wa + wb) / 2;
  g.textAlign = "left"; g.fillText(a, sx, 1250); g.fillStyle = "#e0659a"; g.fillText(b, sx + wa, 1250);
  return c.toDataURL("image/png");
}

const BEAD_COLS = { blush: "#f6b8ca", hotpink: "#ef8fb2", butter: "#fde48e", mint: "#bfe3b4", sky: "#cfe9f5", lilac: "#e3d4f2", peach: "#f9c6a8", white: "#fffaf5" };
let br = state.br || { cols: ["blush", "butter", "mint"], pattern: "alternate", text: "BFF" };
function beadSeq() {
  const n = 26, letters = br.text.toUpperCase().replace(/[^A-Z0-9♥ ]/g, "").slice(0, 10).split("").filter(c => c !== " ");
  const others = n - letters.length, seq = [];
  const cols = br.cols.length ? br.cols : ["blush"];
  let seed = 7;
  for (let i = 0; i < others; i++) {
    if (br.pattern === "alternate") seq.push(cols[i % cols.length]);
    else if (br.pattern === "blocks") seq.push(cols[Math.floor(i / 3) % cols.length]);
    else { seed = (seed * 9301 + 49297) % 233280; seq.push(cols[Math.floor(seed / 233280 * cols.length)]); }
  }
  const half = Math.floor(others / 2);
  return [...seq.slice(0, half), ...letters.map(l => ({ l })), ...seq.slice(half)];
}
function braceletSvg() {
  const seq = beadSeq(), N = seq.length, R = 110;
  const li = seq.map((b, i) => b.l ? i : -1).filter(i => i >= 0);
  const center = li.length ? (li[0] + li[li.length - 1]) / 2 : 0;
  const beads = seq.map((b, i) => {
    const a = -Math.PI / 2 + ((i - center) / N) * Math.PI * 2;
    const x = 150 + R * Math.cos(a), y = 150 + R * Math.sin(a);
    if (b.l) return `<g transform="translate(${x} ${y})"><rect x="-12" y="-12" width="24" height="24" rx="5" fill="#fff" stroke="#e6d3da" stroke-width="1.5"/><text y="6" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="15" fill="#57303f">${esc(b.l)}</text></g>`;
    return `<circle cx="${x}" cy="${y}" r="12.5" fill="${BEAD_COLS[b]}" stroke="rgba(87,48,63,.18)" stroke-width="1"/><circle cx="${x - 4}" cy="${y - 4}" r="3.5" fill="#fff" opacity=".7"/>`;
  }).join("");
  return `<svg class="br-svg" viewBox="0 0 300 300" role="img" aria-label="Bracelet preview"><circle cx="150" cy="150" r="${R}" fill="none" stroke="#d9c3cb" stroke-width="1.5"/>${beads}</svg>`;
}

const VDB = {
  db: null, mem: [], ok: true,
  open() {
    if (this.db || !this.ok) return Promise.resolve(this.db);
    return new Promise((res) => {
      try {
        const rq = indexedDB.open("make-it-cute-videos", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("videos", { keyPath: "id" });
        rq.onsuccess = () => { this.db = rq.result; res(this.db); };
        rq.onerror = () => { this.ok = false; res(null); };
      } catch (e) { this.ok = false; res(null); }
    });
  },
  async all() {
    const db = await this.open(); if (!db) return this.mem.slice();
    return new Promise((res) => { try { const rq = db.transaction("videos").objectStore("videos").getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch (e) { res([]); } });
  },
  async put(v) {
    const db = await this.open(); if (!db) { this.mem.push(v); return; }
    return new Promise((res) => { try { const tx = db.transaction("videos", "readwrite"); tx.objectStore("videos").put(v); tx.oncomplete = () => res(); tx.onerror = () => { this.mem.push(v); res(); }; } catch (e) { this.mem.push(v); res(); } });
  },
  async del(id) {
    this.mem = this.mem.filter(v => v.id !== id);
    const db = await this.open(); if (!db) return;
    return new Promise((res) => { try { const tx = db.transaction("videos", "readwrite"); tx.objectStore("videos").delete(id); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });

};

  }
  const st = e.target.closest("[data-set]");
  if (st) { const k = st.dataset.set; state.settings[k] = !state.settings[k]; persist(); applySettings(); if (k === "safeOnly") cat = state.settings.safeOnly ? "safe" : "all"; if (k === "music") Music.sync(); renderSettings(); return; }
  if (e.target.closest("#musicBtn")) { state.settings.music = !state.settings.music; persist(); Music.sync(); if (current() === "app-settings") renderSettings(); return; }
  if (e.target.closest("#clearStuff")) { if (clearArm === "stuff") { clearArm = null; Object.assign(state, { saved: [], made: [], steps: {}, photos: {}, trades: {}, shopDone: [] }); persist(); renderSettings(); $("#clearMsg").textContent = "Cleared!"; } else { clearArm = "stuff"; renderSettings(); } return; }
  if (e.target.closest("#clearVids")) { if (clearArm === "vids") { clearArm = null; VDB.all().then(l => Promise.all(l.map(v => VDB.del(v.id)))).then(() => { renderSettings(); $("#clearMsg").textContent = "All videos deleted."; }); } else { clearArm = "vids"; renderSettings(); } return; }
  const av = e.target.closest("[data-av]");
  if (av) { state.profile.avatar = av.dataset.av; persist(); updateAvatarBtn(); document.querySelectorAll("[data-av]").forEach(x => x.setAttribute("aria-pressed", x === av)); document.querySelector(".pf-av use").setAttribute("href", "#" + av.dataset.av); return; }
  if (e.target.closest("#makeCode")) { toCode(backupData(false)).then(code => { $("#codeOut").value = code; $("#codeBox").hidden = false;
      const link = RESTORE_BASE + "#restore-" + code; window.__restoreLink = link;
      try { if (typeof qrcode !== "undefined") { const q = qrcode(0, "L"); q.addData(link); q.make(); $("#qrBox").innerHTML = q.createSvgTag({ cellSize: 4, margin: 3, scalable: true }); $("#qrWrap").hidden = false; } } catch (err) {}
      try { const url = URL.createObjectURL(new Blob([JSON.stringify(backupData(true))], { type: "application/json" })); const a = $("#saveFile"); a.href = url; a.hidden = false; } catch (err) {} }); return; }
  if (e.target.closest("#copyLink")) { const msg = $("#linkMsg"); try { navigator.clipboard.writeText(window.__restoreLink).then(() => { msg.textContent = "Copied! Send it to yourself."; }, () => { msg.textContent = "Couldn't copy. Use the long code instead."; }); } catch (err) { msg.textContent = "Couldn't copy. Use the long code instead."; } return; }
  if (e.target.closest("#copyCode")) { const ta = $("#codeOut"), msg = $("#codeMsg"); const sel = () => { ta.focus(); ta.select(); msg.textContent = "Selected. Copy it from here."; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "Copied!"; }, sel); } catch (err) { sel(); } return; }
  if (e.target.closest("#useCode")) { const code = $("#codeIn").value; if (!code.trim()) { $("#restoreMsg").textContent = "Paste your save code first."; return; }
    if (!restoreArm) { restoreArm = true; const b = e.target.closest("#useCode"); b.textContent = "Tap again to replace my stuff"; return; }
    fromCode(code).then(doRestore, () => { restoreArm = false; $("#useCode").textContent = "Bring it back"; $("#restoreMsg").textContent = "That code didn't work. Check that you copied all of it and try again."; }); return; }
  const bt = e.target.closest("[data-batch]");
  if (bt) { batch = +bt.dataset.batch; renderStory(T.find(x => x.id === current()), true); return; }
  const tm = e.target.closest("[data-timer]");
  if (tm) { const t = T.find(x => x.id === current()); startTimer(+tm.dataset.timer, t ? t.title + " · step " + slide : "Craft timer"); return; }
  if (e.target.closest("#timerStop")) { stopTimer(); return; }
  if (e.target.closest("#readBtn")) { const t = T.find(x => x.id === current()); if (t) speak(slideText(t)); return; }
  if (e.target.closest("#filmBtn")) { pendingCraft = current(); go("my-videos"); return; }
  if (e.target.closest("#vidCancel")) { pendingVid = null; renderVideos(); return; }
  if (e.target.closest("#vidSave")) { const v = { id: Date.now().toString(36), title: ($("#vidTitle").value || "My craft video").trim(), craftId: $("#vidCraft").value, date: Date.now(), blob: pendingVid, type: pendingVid.type };
    pendingVid = null; pendingCraft = null; VDB.put(v).then(renderVideos); hearts(e.clientX, e.clientY); return; }
  const vd = e.target.closest("[data-vdel]");
  if (vd) { const id = vd.dataset.vdel; if (delArm === id) { delArm = null; VDB.del(id).then(renderVideos); } else { delArm = id; renderVideos(); setTimeout(() => { if (delArm === id) { delArm = null; if (current() === "my-videos") renderVideos(); } }, 4000); } return; }
  const vs = e.target.closest("[data-vshare]");
  if (vs) { VDB.all().then(list => { const v = list.find(x => x.id === vs.dataset.vshare); if (!v) return; const f = new File([v.blob], "craft-video.mp4", { type: v.type || "video/mp4" });
    try { if (navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: v.title }).catch(() => {}); } catch (err) {} }); return; }
  if (e.target.closest("#printBtn")) { try { window.print(); } catch (err) {} return; }
  const sh = e.target.closest("[data-shop]");
  if (sh) { const k = sh.dataset.shop, d = new Set(state.shopDone); d.has(k) ? d.delete(k) : d.add(k); state.shopDone = [...d]; persist(); const y = window.scrollY; renderShop(); window.scrollTo(0, y); return; }
  if (e.target.closest("#shopReset")) { state.shopDone = []; persist(); renderShop(); return; }
  if (e.target.closest("#copyShop")) {
    const txt = $("#shopText").textContent, msg = $("#shopMsg");
    const sel = () => { const el = $("#shopText"); el.classList.remove("sr"); const r = document.createRange(); r.selectNodeContents(el); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); msg.textContent = "Selected. Copy it from here."; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Copied!"; }, sel); } catch (err) { sel(); }
    return;
  }
  if (e.target.closest("#savePol")) { const t = T.find(x => x.id === current()); const b = e.target.closest("#savePol"); b.textContent = "Making it..."; makePolaroid(t).then(u => { b.textContent = "Save my polaroid"; showPolaroid(u); }, () => { b.textContent = "Save my polaroid"; }); return; }
  if (e.target.closest("#polClose") || e.target.classList.contains("pol-modal")) { document.querySelector(".pol-modal")?.remove(); return; }
  if (e.target.closest("#madeBtn")) {
    const t = T.find(x => x.id === current()); if (!t) return;
    const on = state.made.includes(t.id);
    state.made = on ? state.made.filter(x => x !== t.id) : [...state.made, t.id];
    persist(); renderStory(t, true);
    if (!on) hearts(e.clientX, e.clientY);
  }
});
document.addEventListener("keydown", (e) => {
  if (!T.find(x => x.id === current())) return;
  if (e.target.closest("input")) return;
  if (e.key === "ArrowRight") moveSlide(1);
  if (e.key === "ArrowLeft") moveSlide(-1);
});
let touchX = null;
document.addEventListener("touchstart", (e) => { if (e.target.closest(".slide")) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) moveSlide(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("input", (e) => {
  if (e.target.id === "hTop") { hm.top = e.target.value; document.querySelectorAll("[data-msg]").forEach(x => x.setAttribute("aria-pressed", "false")); refreshHanger(); }
  if (e.target.id === "hSub") { hm.sub = e.target.value; document.querySelectorAll("[data-msg]").forEach(x => x.setAttribute("aria-pressed", "false")); refreshHanger(); }
  if (e.target.id === "q") { query = e.target.value; renderGrid(); document.querySelectorAll("[data-supply]").forEach(x => x.setAttribute("aria-pressed", x.dataset.supply === query.trim().toLowerCase())); }
  if (e.target.id === "pfName") { const v = cleanName(e.target.value); if (v !== e.target.value) e.target.value = v; state.profile.name = v.trim(); persist(); updateAvatarBtn(); const h = document.querySelector(".pf-txt h1"); if (h) h.textContent = state.profile.name ? state.profile.name.toLowerCase() : "my profile"; }
  if (e.target.id === "volIn") { state.settings.vol = +e.target.value; persist(); const sp = e.target.closest(".set-row").querySelector(".set-txt span"); if (sp) sp.textContent = state.settings.vol + "%"; if (Music.playing && !Music.ducked) Music.fade(Music.vol()); }
  if (e.target.id === "bmText") { bm.q = e.target.value; document.querySelectorAll("[data-bm-q]").forEach(x => x.setAttribute("aria-pressed", "false")); refreshBm(); }
  if (e.target.id === "sqText") { sq.name = e.target.value; state.sq = sq; persist(); $("#sqName").textContent = sq.name || "name me!"; }
  if (e.target.id === "brText") { br.text = e.target.value; refreshBr(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "fileIn" && e.target.files[0]) { e.target.files[0].text().then(txt => doRestore(JSON.parse(txt))).catch(() => { $("#restoreMsg").textContent = "That file didn't work. Pick the make-it-cute-backup file."; }); return; }
  if (e.target.id === "vidIn" && e.target.files[0]) { pendingVid = e.target.files[0]; renderVideos(); return; }
  if (e.target.id === "photoIn" && e.target.files[0]) { const t = T.find(x => x.id === current()); if (t) savePhoto(t.id, e.target.files[0]); }
});
window.addEventListener("hashchange", () => { window.__navs = (window.__navs || 0) + 1; route(); });
route();
runTimer();

/* ---------- home hello: name, continue, surprise ---------- */
function renderHello() {
  const box = $("#hello"); if (!box) return;
  const name = (state.profile && state.profile.name) || "";
  const open = Object.entries(state.steps || {}).filter(([id, n]) => n > 0 && !state.made.includes(id) && T.find(x => x.id === id));
  const last = open.length ? T.find(x => x.id === open[open.length - 1][0]) : null;
  const total = last ? (last.steps.length + 3) : 0;
  box.innerHTML = `<p class="hello-h">${name ? `hi <em>${esc(name.toLowerCase())}</em>! ` : "hi crafter! "}what are we making?</p>
    <div class="hello-row">
      ${last ? `<button class="hello-btn" data-go="${last.id}">${art(last.st, "")}<span><b>Keep going: ${esc(last.title)}</b><small>Page ${Math.min(state.steps[last.id] + 1, total)} of ${total}</small></span></button>` : ""}
      <button class="hello-btn surprise" id="surpriseBtn">${art("s-star", "")}<span><b>Surprise me!</b><small>Pick a random craft for me</small></span></button>
    </div>`;
}
document.addEventListener("click", e => {
  if (!e.target.closest("#surpriseBtn")) return;
  let pool = T.filter(t => !state.made.includes(t.id) && t.cat !== "basics");
  if (state.settings && state.settings.safeOnly && typeof isSafe === "function") pool = pool.filter(isSafe);
  if (!pool.length) pool = T;
  go(pool[Math.floor(Math.random() * pool.length)].id);
});
</script>
</body>
</html>
